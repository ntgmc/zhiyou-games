name: CI and deploy zhiyou-games to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Verify game rules and music lifecycle
        run: npm test
      - name: Build static publish directory
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Publish reviewed build
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public game and music files
        run: node scripts/verify-site.js
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
